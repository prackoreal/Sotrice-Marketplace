<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Light Lab</title>
<style>html,body{color:#d7dde6;background:#06080c;height:100%;margin:0;font:13px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}#stage{background:#06080c;position:fixed;inset:0}canvas{touch-action:none;background:#06080c;width:100%;height:100%;display:block}#ui{padding:8px 10px calc(8px + env(safe-area-inset-bottom));color:#d7dde6;background:#080b10d1;border-top:1px solid #1c2430;flex-wrap:wrap;align-items:center;gap:8px 14px;display:flex;position:fixed;bottom:0;left:0;right:0}#ui label{color:#aeb8c6;white-space:nowrap;align-items:center;gap:6px;display:flex}#ui input[type=range]{accent-color:#e0a23c;width:200px;max-width:46vw}#ui input[type=date]{color:#d7dde6;--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark;background:#0e131b;border:1px solid #2a3442;border-radius:6px;padding:3px 6px}button{color:#d7dde6;font:inherit;cursor:pointer;background:#151c27;border:1px solid #2c3746;border-radius:6px;padding:5px 10px}button:hover{background:#1d2735}button.on{color:#ffe3ad;background:#6b4a12;border-color:#e0a23c}#title{pointer-events:none;color:#e8edf5;text-shadow:0 1px 6px #000;position:fixed;top:10px;left:12px;right:12px}#title b{letter-spacing:.02em;font-size:15px}#title span{color:#aeb8c6;max-width:560px;font-size:12px;display:block}#hud{color:#c6cfdb;background:#080b10b8;border:1px solid #1c2430;border-radius:8px;min-width:250px;padding:7px 9px;font:12px/1.4 ui-monospace,Consolas,monospace;display:none;position:fixed;top:58px;left:12px}#bar{background:#1a2230;border-radius:3px;height:6px;margin:4px 0;overflow:hidden}#bar i{background:#e0a23c;width:0;height:100%;display:block}#err{text-align:center;color:#e8edf5;background:#06080c;justify-content:center;align-items:center;padding:24px;display:none;position:fixed;inset:0}#hint{color:#8b97a8;pointer-events:none;text-align:right;font-size:12px;position:fixed;top:10px;right:12px}@media (width<=480px){#hint,#title span{display:none}#hud{min-width:0;max-width:calc(100vw - 16px);font-size:11px;top:34px;left:8px}#ui input[type=range]{width:130px}}</style>
  <script type="module" crossorigin src="./assets/index-meSqdAWP.js"></script>
</head>
<body>
<div id="stage"></div>
<div id="title"><b>Leaf Light Memory</b><span>Every pixel reads a remembered, path-traced light state. It converges, then sleeps. Drag the upper leaf and only its shadow re-converges.</span></div>
<div id="hint">drag: orbit · drag the upper leaf: move it · wheel: zoom</div>
<div id="hud"></div>
<div id="ui">
  <label>Date <input type="date" id="date"></label>
  <label>Time <input type="range" id="hour" min="0" max="24" step="0.01" value="12.5"><span id="hourTxt" style="min-width:90px">12:30</span></label>
  <button id="play">Play day (30 s)</button>
  <button id="noon">Noon</button>
  <button id="golden">Golden hour</button>
  <label>Upper leaf height <input type="range" id="h2" min="-0.12" max="0.2" step="0.005" value="0"></label>
  <label>Aperture <input type="range" id="fs" min="1.4" max="45" step="0.1" value="11" style="width:110px"><span id="fsTxt" style="min-width:38px">f/11</span></label>
  <label><input type="checkbox" id="mem"> light memory</label>
  <label>EV <input type="range" id="ev" min="-2" max="2" step="0.1" value="0" style="width:90px"></label>
</div>
<div id="err"><div><b>This page needs WebGL2.</b><br><span style="color:#aeb8c6">Open it in a current Chrome, Edge, Firefox or Safari.</span></div></div>

</body>
</html>
